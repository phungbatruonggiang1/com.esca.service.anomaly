<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the service itself may own the name. -->
  <policy user="root">
    <allow own="vn.sparc.esca.Anomaly1"/>
  </policy>

  <!-- Clients run as the weston user, so group access rather than a user
       rule. The audio group already exists on the image and owns the sound
       devices; the shared-memory ring is given to it too, so a client
       granted a buffer over the bus can actually read it. -->
  <policy group="audio">
    <allow send_destination="vn.sparc.esca.Anomaly1"/>
    <allow receive_sender="vn.sparc.esca.Anomaly1"/>
  </policy>

  <policy user="root">
    <allow send_destination="vn.sparc.esca.Anomaly1"/>
    <allow receive_sender="vn.sparc.esca.Anomaly1"/>
  </policy>

  <!-- Everyone else is refused by the default deny below. -->
  <policy context="default">
    <deny own="vn.sparc.esca.Anomaly1"/>
    <deny send_destination="vn.sparc.esca.Anomaly1"/>
  </policy>
</busconfig>
